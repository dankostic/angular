<section class="testimonials">
  <div class="container">
    <div class="section-heading">
      <span class="eyebrow">Loved by fans</span>
      <h2>What people are saying</h2>
      <p>A few words from people who check Sportaling every matchday.</p>
    </div>

    <div class="testimonial-grid">
      @for (item of testimonials(); track item.name) {
        <figure class="testimonial-card">
          <svg class="quote-mark" viewBox="0 0 32 24" width="28" height="21" fill="none">
            <path
              d="M13.6 0 8.4 11.2H14v12.8H0V11.2L5.2 0h8.4Zm18 0-5.2 11.2h5.6v12.8H18V11.2L23.2 0h8.4Z"
              fill="currentColor"
            />
          </svg>
          <blockquote>{{ item.quote }}</blockquote>
          <figcaption>
            <div class="avatar">{{ initials(item.name) }}</div>
            <div>
              <div class="name">{{ item.name }}</div>
              <div class="role">{{ item.role }}</div>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
