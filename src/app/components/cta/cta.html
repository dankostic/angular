<section class="cta">
  <div class="container">
    <div class="cta-card">
      <div class="cta-glow" aria-hidden="true"></div>

      <div class="cta-content">
        <h2>Never miss a kickoff</h2>
        <p>Get a daily digest of fixtures, results, and standings for the teams you follow.</p>

        @if (!submitted()) {
          <form class="cta-form" (ngSubmit)="subscribe()">
            <input
              type="email"
              name="email"
              required
              placeholder="you@example.com"
              [(ngModel)]="email"
            />
            <button class="btn btn-primary" type="submit">Subscribe</button>
          </form>
        } @else {
          <div class="cta-success">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none">
              <path
                d="M4 10.5 8 14.5 16 6.5"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            You're on the list — check your inbox soon.
          </div>
        }
      </div>
    </div>
  </div>
</section>
